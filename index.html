<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ViralFlow AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0b0f19;
font-family:Arial,sans-serif;
color:white;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.title{
text-align:center;
font-size:32px;
font-weight:bold;
margin-bottom:10px;
color:#00ff88;
}

.subtitle{
text-align:center;
color:#aaa;
margin-bottom:25px;
}

textarea{
width:100%;
height:160px;
background:#111827;
border:1px solid #333;
border-radius:12px;
padding:15px;
color:white;
font-size:16px;
outline:none;
resize:none;
}

button{
width:100%;
margin-top:15px;
padding:16px;
border:none;
border-radius:12px;
background:#00ff88;
color:black;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:0.6;
}

.loading{
display:none;
text-align:center;
margin-top:20px;
color:#00ff88;
}

.result{
display:none;
margin-top:20px;
background:#111827;
padding:20px;
border-radius:12px;
border:1px solid #333;
white-space:pre-wrap;
line-height:1.7;
}

.error{
display:none;
margin-top:20px;
background:#330000;
padding:15px;
border-radius:12px;
color:#ff6666;
}

.footer{
margin-top:25px;
text-align:center;
color:#666;
font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<div class="title">
🔥 ViralFlow AI
</div>

<div class="subtitle">
TikTok Hooks • Captions • WhatsApp Closing • Viral Scripts
</div>

<textarea
id="prompt"
placeholder="Mfano: Nipe TikTok hook ya kuuza viatu..."
></textarea>

<button id="generateBtn" onclick="generateAI()">
🚀 GENERATE
</button>

<div class="loading" id="loading">
⏳ ViralFlow AI inafikiria...
</div>

<div class="error" id="error"></div>

<div class="result" id="result"></div>

<div class="footer">
Powered by Groq + Cloudflare Workers
</div>

</div>

<script>

const API_URL =
"https://viralflow-groq-api.hapeenooo555.workers.dev";

async function generateAI(){

const prompt =
document.getElementById("prompt").value.trim();

const btn =
document.getElementById("generateBtn");

const loading =
document.getElementById("loading");

const result =
document.getElementById("result");

const error =
document.getElementById("error");

if(!prompt){
alert("Andika prompt kwanza");
return;
}

btn.disabled = true;
loading.style.display = "block";
result.style.display = "none";
error.style.display = "none";

try{

const response = await fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
prompt:prompt
})
});

if(!response.ok){
throw new Error(
"API Error: " + response.status
);
}

const data = await response.json();

result.innerText =
data.result || "Hakuna majibu";

result.style.display = "block";

}catch(err){

error.innerText =
err.message || "Kuna tatizo limetokea";

error.style.display = "block";

}

finally{

btn.disabled = false;
loading.style.display = "none";

}

}

</script>

</body>
</html>
